[package]
name = "crafting-web"
description = "Web user interface of the Path of Exile 1 crafting simulator"
version.workspace = true
edition.workspace = true

[dependencies]
crafting-core = { path = "../crafting-core" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Crypto", "Document", "Element", "EventTarget", "HtmlButtonElement", "HtmlElement", "Location", "Node", "Window"] }
