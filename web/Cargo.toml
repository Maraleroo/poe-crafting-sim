[package]
name = "crafting-web"
description = "Web user interface of the Path of Exile 1 crafting simulator"
version.workspace = true
edition.workspace = true

[dependencies]
crafting-core = { path = "../crafting-core" }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlElement", "Node", "Window"] }
